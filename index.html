<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makerij</title>
<style>
  :root { --bg:#fbfaf7; --fg:#222; --muted:#666; --line:#e4e0d8; --accent:#7a4e2d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1a18; --fg:#eee; --muted:#aaa; --line:#333; --accent:#d9a46c; } }
  body { background:var(--bg); color:var(--fg); font:17px/1.6 Georgia, serif; max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { font-weight:normal; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 32px; }
  ul { list-style:none; padding:0; }
  li { border-top:1px solid var(--line); padding:14px 0; }
  a { color:var(--accent); }
  small { color:var(--muted); display:block; }
</style>
</head>
<body>
<h1>Makerij</h1>
<p class="sub">Kleine dingen die ik bouw. Marieke van Vliet · Breinpaleis</p>
<ul>
  <!-- Nieuw ding: map maken met een index.html erin, en hier een regel toevoegen -->
  <li><em>Nog leeg. Binnenkort meer.</em></li>
</ul>
</body>
</html>
